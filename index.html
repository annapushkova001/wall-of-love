<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>wall of love — es club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.cdnfonts.com/css/normalidad-extended" rel="stylesheet">
<style>
  :root {
    --bg-1: #0a0a0f;
    --bg-2: #12121a;
    --bg-card: rgba(255, 255, 255, 0.06);
    --bg-card-hover: rgba(255, 255, 255, 0.1);
    --glass-border: rgba(255, 255, 255, 0.08);
    --text: #f0eef5;
    --text-muted: rgba(240, 238, 245, 0.5);
    --accent-1: #ff6b6b;
    --accent-2: #ffa259;
    --accent-3: #a259ff;
    --accent-4: #59c4ff;
    --radius: 20px;
    --col-gap: 18px;
    --row-gap: 18px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg-1);
    color: var(--text);
    font-family: 'Outfit', sans-serif;
    font-size: 15px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* --- AMBIENT BACKGROUND --- */
  .bg-glow {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }

  .bg-glow .orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(120px);
    opacity: 0.2;
    animation: orbFloat 20s ease-in-out infinite;
  }

  .bg-glow .orb-1 {
    width: 700px; height: 700px;
    background: var(--accent-1);
    top: -15%; left: -10%;
    animation: orbFloat1 25s ease-in-out infinite;
  }

  .bg-glow .orb-2 {
    width: 550px; height: 550px;
    background: var(--accent-3);
    top: 20%; right: -12%;
    animation: orbFloat2 30s ease-in-out infinite;
  }

  .bg-glow .orb-3 {
    width: 450px; height: 450px;
    background: var(--accent-4);
    bottom: 10%; left: 25%;
    animation: orbFloat3 22s ease-in-out infinite;
  }

  .bg-glow .orb-4 {
    width: 500px; height: 500px;
    background: var(--accent-2);
    top: 50%; left: -5%;
    animation: orbFloat4 28s ease-in-out infinite;
  }

  @keyframes orbFloat1 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    25% { transform: translate(60px, 40px) scale(1.15); }
    50% { transform: translate(-30px, 80px) scale(0.95); }
    75% { transform: translate(40px, -20px) scale(1.08); }
  }

  @keyframes orbFloat2 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    25% { transform: translate(-50px, 30px) scale(1.1); }
    50% { transform: translate(40px, -40px) scale(0.9); }
    75% { transform: translate(-20px, -60px) scale(1.05); }
  }

  @keyframes orbFloat3 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    30% { transform: translate(70px, -50px) scale(1.12); }
    60% { transform: translate(-40px, 30px) scale(0.92); }
  }

  @keyframes orbFloat4 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    35% { transform: translate(50px, -70px) scale(1.1); }
    65% { transform: translate(-60px, 40px) scale(0.95); }
  }

  /* --- NOISE OVERLAY --- */
  .noise {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    z-index: 1;
    opacity: 0.03;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
  }

  .content { position: relative; z-index: 2; }

  /* --- HEADER --- */
  .hero {
    text-align: center;
    padding: 72px 24px 24px;
    max-width: 800px;
    margin: 0 auto;
    position: relative;
  }

  .hero h1 {
    font-family: 'Normalidad Extended', 'Bebas Neue', sans-serif;
    font-size: clamp(42px, 8vw, 80px);
    font-weight: 700;
    line-height: 0.95;
    letter-spacing: -0.05em;
    margin-bottom: 12px;
    white-space: nowrap;
    position: relative;
    display: inline-block;
    animation: fadeUp 0.8s ease 0.1s both;
    background: linear-gradient(
      90deg,
      #fff 0%,
      #fff 40%,
      #D9C6FF 48%,
      #8EC6B2 53%,
      #FF7E56 58%,
      #fff 68%,
      #fff 100%
    );
    background-size: 200% 100%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: fadeUp 0.8s ease 0.1s both, shimmer 4s ease-in-out infinite 1s;
  }

  @keyframes shimmer {
    0% { background-position: 100% 0; }
    100% { background-position: -100% 0; }
  }

  .hero-heart {
    font-size: 28px;
    display: inline-block;
    animation: fadeUp 0.8s ease 0.2s both, heartPulse 1.5s ease-in-out infinite;
    margin-bottom: 8px;
    filter: drop-shadow(0 0 12px rgba(255, 107, 107, 0.5));
  }

  @keyframes heartPulse {
    0%, 100% { transform: scale(1); }
    15% { transform: scale(1.25); }
    30% { transform: scale(1); }
    45% { transform: scale(1.15); }
    60% { transform: scale(1); }
  }





  .hero-stats {
    margin-top: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 32px;
    animation: fadeUp 0.8s ease 0.35s both;
  }

  .stat { text-align: center; }

  .stat-number {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 34px;
    letter-spacing: 0.04em;
    font-weight: 400;
    color: #fff;
  }

  .stat-label {
    font-size: 11px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-top: 2px;
  }

  .stat-divider {
    width: 1px;
    height: 28px;
    background: var(--glass-border);
  }

  /* --- AVATAR CLOUD --- */
  .avatar-cloud {
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 28px;
    animation: fadeUp 0.8s ease 0.25s both;
  }

  .avatar-stack {
    display: flex;
    margin-right: 14px;
  }

  .avatar-stack .av {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: none;
    margin-left: -6px;
    object-fit: cover;
    background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
    transition: transform 0.3s ease;
    opacity: 0;
    transform: translateX(20px);
    animation: avSlideIn 0.5s ease forwards;
  }

  .avatar-stack .av:nth-child(1) { animation-delay: 0.5s; }
  .avatar-stack .av:nth-child(2) { animation-delay: 0.6s; }
  .avatar-stack .av:nth-child(3) { animation-delay: 0.7s; }
  .avatar-stack .av:nth-child(4) { animation-delay: 0.8s; }
  .avatar-stack .av:nth-child(5) { animation-delay: 0.9s; }
  .avatar-stack .av:nth-child(6) { animation-delay: 1.0s; }
  .avatar-stack .av:nth-child(7) { animation-delay: 1.1s; }
  .avatar-stack .av:nth-child(8) { animation-delay: 1.2s; }

  @keyframes avSlideIn {
    to { opacity: 1; transform: translateX(0); }
  }

  .avatar-stack .av:hover {
    transform: scale(1.15);
    z-index: 2;
  }

  .avatar-stack .av:first-child { margin-left: 0; }

  .avatar-cloud .cloud-text {
    font-size: 14px;
    color: var(--text-muted);
    font-weight: 400;
  }

  .avatar-cloud .cloud-text strong {
    color: #fff;
    font-weight: 600;
  }



  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-12px); }
    to { opacity: 1; transform: translateY(0); }
  }



  /* --- MASONRY --- */
  .masonry {
    max-width: 1360px;
    margin: 0 auto;
    padding: 48px 24px 100px;
    display: flex;
    gap: var(--col-gap);
    align-items: flex-start;
  }

  .masonry-col {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: var(--row-gap);
  }

  @media (max-width: 1100px) {
    .masonry-col:nth-child(4) { display: none; }
  }
  @media (max-width: 768px) {
    .masonry-col:nth-child(3) { display: none; }
    .masonry-col:nth-child(4) { display: none; }
  }
  @media (max-width: 480px) {
    .masonry-col:nth-child(2) { display: none; }
    .masonry-col:nth-child(3) { display: none; }
    .masonry-col:nth-child(4) { display: none; }
    .masonry { max-width: 420px; }
  }

  /* --- CARD BASE --- */
  .card {
    background: var(--bg-card);
    backdrop-filter: blur(16px);
    border-radius: var(--radius);
    border: 1px solid var(--glass-border);
    overflow: hidden;
    transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
    opacity: 0;
    transform: translateY(30px) scale(0.97);
  }

  .card.revealed {
    opacity: 1;
    transform: translateY(0) scale(1);
  }

  .card:hover {
    background: var(--bg-card-hover);
    border-color: rgba(255, 255, 255, 0.14);
    transform: translateY(-4px) scale(1.01);
    box-shadow: 0 8px 40px rgba(0, 0, 0, 0.3), 0 0 60px rgba(255, 107, 107, 0.05);
  }

  /* --- PHOTO CARD --- */
  .card-photo img {
    width: 100%;
    display: block;
  }

  .card-photo .card-caption {
    padding: 16px 20px;
    font-size: 14px;
    line-height: 1.65;
    color: var(--text);
    font-weight: 300;
  }

  .card-photo .card-sender {
    margin: 0 20px 16px;
    padding-top: 12px;
  }

  /* --- TEXT CARD --- */
  .card-text {
    padding: 28px 24px 24px;
  }

  .card-text .quote-accent {
    width: 28px;
    height: 3px;
    border-radius: 2px;
    background: linear-gradient(90deg, var(--accent-1), var(--accent-2));
    margin-bottom: 16px;
  }

  .card-text .card-body {
    font-size: 14.5px;
    line-height: 1.75;
    color: rgba(240, 238, 245, 0.85);
    font-weight: 300;
    white-space: pre-line;
  }

  .card-text .card-body.long {
    max-height: 200px;
    overflow: hidden;
    position: relative;
  }

  .card-text .card-body.long::after {
    display: none;
  }

  .card-text .card-body.expanded {
    max-height: none;
  }

  .card-text .read-more {
    display: none;
    margin-top: 12px;
    font-size: 13px;
    color: var(--accent-1);
    cursor: pointer;
    font-weight: 500;
    transition: all 0.2s;
    padding: 4px 0;
    border: none;
    background: none;
    font-family: inherit;
  }

  .card-text .read-more:hover { opacity: 0.7; }
  .card-text .card-body.long ~ .read-more { display: inline-block; }
  .card-text .card-body.expanded ~ .read-more span { display: none; }

  /* --- SENDER --- */
  .card-sender {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 18px;
    padding-top: 14px;
    border-top: 1px solid var(--glass-border);
  }

  .avatar {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;
    font-size: 13px;
    color: white;
    flex-shrink: 0;
    position: relative;
    overflow: hidden;
  }

  .card-sender .sender-info .name {
    font-weight: 500;
    font-size: 13px;
    color: var(--text);
  }

  .card-sender .sender-info .date {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 1px;
  }

  /* --- GRADIENT ACCENT CARDS --- */
  .card-gradient-warm {
    background: linear-gradient(145deg, rgba(255, 107, 107, 0.15), rgba(255, 162, 89, 0.08));
    border-color: rgba(255, 107, 107, 0.15);
  }

  .card-gradient-warm:hover {
    background: linear-gradient(145deg, rgba(255, 107, 107, 0.22), rgba(255, 162, 89, 0.12));
    border-color: rgba(255, 107, 107, 0.25);
    box-shadow: 0 8px 40px rgba(255, 107, 107, 0.1);
  }

  .card-gradient-warm .card-body.long::after {
    display: none; /* background: linear-gradient(transparent, rgba(30, 15, 15, 0.95));
  }

  .card-gradient-cool {
    background: linear-gradient(145deg, rgba(162, 89, 255, 0.12), rgba(89, 196, 255, 0.08));
    border-color: rgba(162, 89, 255, 0.12);
  }

  .card-gradient-cool:hover {
    background: linear-gradient(145deg, rgba(162, 89, 255, 0.2), rgba(89, 196, 255, 0.12));
    border-color: rgba(162, 89, 255, 0.2);
    box-shadow: 0 8px 40px rgba(162, 89, 255, 0.1);
  }

  .card-gradient-cool .card-body.long::after {
    display: none; /* background: linear-gradient(transparent, rgba(18, 15, 30, 0.95));
  }

  .card-gradient-cool .quote-accent {
    background: linear-gradient(90deg, var(--accent-3), var(--accent-4));
  }

  .card-gradient-sunset {
    background: linear-gradient(145deg, rgba(255, 162, 89, 0.15), rgba(255, 107, 107, 0.1), rgba(162, 89, 255, 0.08));
    border-color: rgba(255, 162, 89, 0.15);
  }

  .card-gradient-sunset:hover {
    background: linear-gradient(145deg, rgba(255, 162, 89, 0.22), rgba(255, 107, 107, 0.15), rgba(162, 89, 255, 0.12));
    border-color: rgba(255, 162, 89, 0.25);
    box-shadow: 0 8px 40px rgba(255, 162, 89, 0.1);
  }

  .card-gradient-sunset .quote-accent {
    background: linear-gradient(90deg, var(--accent-2), var(--accent-1), var(--accent-3));
  }

  .card-gradient-sunset .card-body.long::after {
    display: none; /* background: linear-gradient(transparent, rgba(25, 18, 12, 0.95));
  }

  /* --- FOOTER --- */
  .footer {
    text-align: center;
    padding: 40px 24px 60px;
    color: var(--text-muted);
    font-size: 14px;
    font-weight: 300;
    position: relative;
    z-index: 2;
  }

  .footer a {
    color: var(--accent-1);
    text-decoration: none;
    font-weight: 500;
    transition: opacity 0.2s;
  }

  .footer a:hover { opacity: 0.7; }

  /* --- MOBILE HERO --- */
  @media (max-width: 768px) {
    .hero {
      padding: 56px 16px 12px;
    }

    .hero h1 {
      font-size: 18vw !important;
      margin-bottom: 14px;
    }

    .hero-stats {
      gap: 10px;
      margin-top: 14px;
    }

    .stat-number {
      font-size: 20px !important;
      line-height: 1.1;
    }

    .stat-label {
      font-size: 8px !important;
      letter-spacing: 0.04em;
      margin-top: 1px;
    }

    .stat-divider {
      height: 16px;
    }

    .masonry {
      padding-top: 28px !important;
    }
  }
</style>
</head>
<body>

<div class="bg-glow">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
  <div class="orb orb-4"></div>
</div>
<div class="noise"></div>

<div class="content">

<header class="hero">
  <h1>wall of love</h1>
  <div class="hero-heart">❤️</div>
</header>



<main class="masonry" id="masonry"></main>

<footer class="footer">
  made with love by <a href="#">es club</a>
</footer>

</div>

ing great ❄️\n\nя провела потрясающий месяц в es club for sure! он был моим первым и я получила огромное удовольствие от прохождения платформы и участия в спикинг клабах 🥰 невероятно интересные топики для обсуждений, классный вокабуляр, начала заполнять себе квизлет отдельно с вокабуляром из es club :))\n\nу меня была запланирована поездка на начало марта, поэтому я решила пока взять паузу)) очень хочу вернуться, наверное, ближе к апрелю/середине апреля\n\nthank you ✨🙌","caption": "","photo": "","type": "text","date": 1773296904},{"msg_id": 293,"sender": "Vlada","username": "vladininya","text": "Поэтому хотела сказать тебе и всей команде большое спасибо за возможность учиться в такой классной школе и за атмосферу, которую вы создаёте🧚‍♀️🤍🤍","caption": "","photo": "","type": "text","date": 1773264001,"avatar": "avatars/1221029347.jpg"},{"msg_id": 291,"sender": "Vlada","username": "vladininya","text": "Привееет🥰 Спасибо большое за сообщение! \n\nПервый месяц пролетел очень быстро, мне понравилось, всё здорово. Я старалась посещать разные speaking clubs и от всех остались суууперские эмоции. Очень нравится атмосфера и не только у менторов, но и у многих участников клуба. Чувствуется, что собираются like-minded people и это создаёт тёплую атмосферу✨\n\nВ дни, когда есть клуб хожу с трепетом от предвкушения в душе, до сих пор не понимаю, как это работает😆 Часто после занятий я записываю сестре кружочек и делюсь своими эмоциями. И буквально вчера она сказала, что даже ещё не начиная слушать эти сообщения, сразу понимает, что я говорю про английский, потому что в такие моменты у меня всегда очень вдохновлённый и радостный вид :)","caption": "","photo": "","type": "text","date": 1773263907,"avatar": "avatars/1221029347.jpg"},{"msg_id": 287,"sender": "Ксеша Каменская","username": "ya_chto_shutka","text": "Привет!\nhahaha thanks 💕\nя ушла немного передохнуть, думала через месяц вернуться, но это слишком заманчивое предложение 😇 готова вернуться сейчас, получается))\n\nобратная связь у меня жестко положительная, вы моя любимая секта ахах\nизначально я думала залететь на 3 месяца и не думала, что продолжу, потому что честно говоря знаю спикинг клубы подешевле 👉👈 НО когда начинаешь заниматься с вами, понимаешь, что это не просто клубы, это ✨коммьюнити✨, то как менторы подготавливают клубы - вау, это всегда очень интересно! + я люблю ваш вайбик и то, что все ребята в es club крутые и открытые 💔\n\nВ общем я не сбежала от вас потому что что-то не так, просто хотела сделать паузу, потому что кроме es club занимаюсь ещё с репетитором, ну и финансово у меня не лучший месяц, если честно\nНо раз такая скидочка, то бегу обратно 👉👈","caption": "","photo": "","type": "text","date": 1773004169,"avatar": "avatars/450152707.jpg"},{"msg_id": 288,"sender": "Коля","username": "","text": "Мне понравился формат и ваша школа! Это был очень приятный и хороший опыт\n\nЯ почувствовал, что у меня низковат уровень, поэтому я пока принял решение подтянуть грамматику\n\nНо мне в целом было комфортно, я ощущал, что все готовы подождать, пока я смогу сформулировать и сказать свою мысль. Также я стал быстрее думать и говорить\n\nОчень понравились темы и вопросы, которые разбираются во время клубов. Оооочень красивые презентации и в целом стиль!","caption": "","photo": "","type": "text","date": 1772915198},{"msg_id": 286,"sender": "Евгения","username": "Ev_gy","text": "Привет 🤍 \n\nДа, на платформе прохожу section 2. Решила прям с первого урока начать и не пожалела, даже в супер базовой теме приветствия были интересные и важные моменты. И так круто, что есть не только лекции, но и разные форматы упражнений на закрепление 👌🏼 и в форме теста, и голосом записать, супер! \n\nВчера был первый speaking club, я решила плавно вливаться в процесс и выбрала sunday brunch. До начала было немного волнительно, не знала, чего вообще ожидать, как все будет проходить, но я тааак кайфанула в процессе 😍 Атмосфера super welcoming. Спасибо большое ментору Нике, она уделила время всем нове ры очень милые, открытые, настоящие профессионалы! Ребята в комьюнити классные. \nУроки на платформе казались мне короткими и быстрыми, но на самом деле каждая section богата новой и полезной информацией и необычными упражнениями, что мне очень нравится. \nПока мне сложно оценить свой прогресс, мне кажется, прошло ещё слишком мало времени. Однако я очень рада, что возобновила изучение английского именно с Вами! Чувствую, что это именно то, что мне нужно было (наконец мозги зашевелились!). Я всем довольна, с удовольствием продолжаю обучение 😊","caption": "","photo": "","type": "text","date": 1760802145},{"msg_id": 255,"sender": "Sofia Ivshina","username": "Sofincha","text": "","caption": "Hey guys 🫶🏻 I’ve watched Grand Mentor Stories recording… Giiiiirls 🥹 I was impressed by everyone💔❤️ Do I pay for the Internet for crying? ) haha . I dived into the speeches so deep so I forgot this is recording and I wanted to put a reaction or leave a comment 😂 Just want to say YOU ARE AMAZING. I’ve cried the deepest emotions and I’ve never regretted for joining that club. You can see my t-shirt is wet🥹 (Truthful reaction)😂","photo": "images/review_255.jpg","type": "photo","date": 1759657527,"avatar": "avatars/831526103.jpg"},{"msg_id": 254,"sender": "Anna Kaizerova","username": "","text": "Tbh after today’s speaking club I want not only to watch the film but also to wear Regina’s outfit for the uni Halloween party! We have it in pink, purple and black colours)\nThank you Val and girrls!! 💖","caption": "","photo": "","type": "text","date": 1759514160},{"msg_id": 249,"sender": "","username": "","text": "","caption": "","photo": "images/review_249.jpg","type": "photo","date": 1759059841},{"msg_id": 250,"sender": "","username": "","text": "","caption": "","photo": "images/review_250.jpg","type": "photo","date": 1759059841},{"msg_id": 251,"sender": "","username": "","text": "","caption": "","photo": "images/review_251.jpg","type": "photo","date": 1759059841},{"msg_id": 252,"sender": "" k we might as well have converted her to our cult","photo": "","type": "text","date": 1754162085,"avatar": "avatars/417566936.jpg"},{"msg_id": 241,"sender": "Арина","username": "","text": "Anyaa such the amazing club again!!! Thank you so much!! The news is really hot and discussing!!  The previous podcast club about nutrition was also really interesting!! After that I’m thinking about food even more!!! 💗💗💗🫡","caption": "","photo": "","type": "text","date": 1753204794},{"msg_id": 239,"sender": "Ксения Гамаюнова","username": "kessy_amber","text": "Heyyyy guys! @snezhanagirina and I met in Moscow before my trip! Thank you for bringing such wonderful people into my life🥹❤️‍🔥❤️‍🔥❤️‍🔥","caption": "","photo": "","type": "text","date": 1748710733,"avatar": "avatars/573261718.jpg"},{"msg_id": 238,"sender": "Sofia Slabkovskaia","username": "","text": "Good evening one more time!\n\nСтандартно удается посещать по 2 клуба в неделю уже месяц. На многое не попадаю из-за часового пояса, но может это к лучшему, я бы так была в затруднительном положении с выбором. Мне очень нравится многообразие форматов разговорного клуба и живая экосистема, возможность заниматься с разными менторами. Побывала у Валерии, у Ани, у тебя. Моя благодарность всем, от всех чувствуется отзывчивость и любовь к своему делу. Собираюсь продолжать и открывать другие форматы🕊️\n\nЧерпаю из бездонного океана лексику, веду записи, по ощущениям - не утекают знания, многое запоминается.  Хочу начать писать эссе, есть какое-то вдохновение после занятий, они часто thought-provoking","caption": "","photo": "","type": "text","date": 1747152750},{"msg_id": 237,"sender": "Anna","username": "","text": "","caption": "Valeriia, thank you so much for an inspiring and thought-provoking conversation! I loved it, so many insights! \nI've even written notes on my Notion 😍","photo": "images/review_237.jpg","type": "photo","date": 1746727170},{"msg_id": 236,"sender": "Veronica Samoylova","username": "veronicasam","text": "I’ve already said it during our club, but I’ll say it again\n\nIf there’s a premium version of a speaking club in ES than it’s definitely the DEBATES CLUB \n\nHuge shoutout to Alina, the mentor, for such thought-provoking statements! \n\nI genuinely appreciate the amount of brainwork we put in, critical thinking, soft skills, reasoning, I mean, there’s so much more to it. \n\nSo dear ES people, do come to Debates it’s so fucking amazing \n(I’m pretty sure our permanent band members will second that ahahah)","caption": "","photo": "","type": "text","date": 1746039879,"avatar": "avatars/292228095.jpg"},{"msg_id": 234,"sender": "valery larionova","username": "valeryverse","text": "","caption": "","photo": "images/review_234.jpg","type": "photo","date": 1744388690,"avatar": "avatars/1195267675.jpg"},{"msg_id": 233,"sender": "","username": "","text": "","caption": "","photo": "images/review_233.jpg","type": "photo","date": 1744387886},{"msg_id": 235,"sender": "Irina Teplyuk","username": "irintea","text": "Valeria, hello again! I just want to say that I really enjoyed our speaking club today. I haven’t discussed anything in English for quite a long time, for a month I think. And l was glad to remember that I can actually say  something in English. Thank you so much for hosting this speaking session ✨ You know, talking about job is even better than the job itself haha \n\nBtw, I really like your jacket, you look stunning 🤍","caption": "","photo": "","type": "text","date": 1744306732,"avatar": "avatars/722256379.jpg"},{"msg_id": 231,"sender": "Maria","username": "","text": "Привет, Аня! Каждый день вспоминала про твое сообщение и хотелось выделить время, чтобы более развернуто ответить)\n\nМне как всегда всё очень нравится! Менторы топ, темы огонь, люблюобожаю и всем вокруг советую!\nВообще, конечно, спасибо всем менторам, всегда такие улыбчивые и заряженные, что просто не остается шансов без улыбки от вас уйти)\n\nВ прошлом месяце не очень много участвовала в звонках, так как было много работы, работа сидячая и вот последнее, что хотелось это еще дольше сидеть за ноутом)) А сейчас, кажется, нашла оптимальный график, подключаюсь и когда выхожу на прогулку, и когда готовлю, или пью где-то кофе. В общем в этом месяце стараюсь быть активнее\nКогда мотивация спадает, подключаюсь на любой клуб, и вот менторы и участники меня как-то каждый раз очень качественно заряжают)\n\nБыло бы здорово, если бы были чаще звонки в 8-9-10 утра. Знаю, что утром не очень много людей собирается. Но вот по себе заметила, что если до работы позанимаюсь вместе, то даже день как-то и сфокусированнее, и веселее проходит)\nMental health club - мой любименький, очень нравится\n\nНа платформе не занимаюсь практически, все откладываю, но когда-нибудь и туда дойду, и тогда и по ней фидбекну","caption": "","photo": "","type": "text","date": 1742468606},{"msg_id": 230,"sender": "A.G.","username": "","text": "Лейла, большое спасибо за занятия! Каждое из них в самое сердечко, записала кучу полезной лексики, лайфхаков, вытащила идиомы из твоей речи и наконец-то разобралась с light l и dark l 🥹","caption": "","photo": "","type": "text","date": 1742034706},{"msg_id": 229,"sender": "Алиса","username": "alicetros","text": "Hi🌸\nIt‘s Alice, we just met on a podcast hub:)\nI just wanted to thank you for that lesson, I really enjoyed the topic and the filling of new interesting vocab!\nAnd also I want to mention how beautiful and cheerful you are, you made my day 1000 times better, your smile is everything! Not only Doechii‘s story inspired me but your perfect ga accent and your charm as well!❤️","caption": "","photo": "","type": "text","date": 1741428741,"avatar": "avatars/721599287.jpg"},{"msg_id": 228,"sender": "","username": "","text": "","caption": "","photo": "images/review_228.jpg","type": "photo","date": 1741080744},{"msg_id": 227,"sender": "","username": "","text": "","caption": "music date","photo": "images/review_227.jpg","type": "photo","date": 1741079136},{"msg_id": 225,"sender": "","username": "","text": "","caption": "mentor stories | Val edition","photo": "images/review_225.jpg","type": "photo","date": 1740568569},{"msg_id": 226,"sender": "","username": "","text": "","caption": "","photo": "images/review_226.jpg","type": "photo","date": 1740568569},{"msg_id": 221,"sender": "Эмма","username": "","text": "Спасибо за поддержу и тёплые слова! \nПрогресс нереальный, речь стала увереннее и свободнее. Меньше русского в голове не перевожу, а сразу говорю на английском, также лучше понимаю, тоже перестала переводить речь других людей. Es club это большая большая любовь! Атмосфера, темы, менторы, форматы, участники все обожаю! ❤️","caption": "","photo": "","type": "text","date": 1740484718},{"msg_id": 222,"sender": "Алиса","username": "alicetros","text": "На shadowing была с Алиной:) постараюсь в следующий раз тогда и к Лере попасть! podcast hub мне тоже очень понравился, спасибо тебе❤️\n вчера вообще пол дня занималась английским и почувствовала, что естественность в моем говорении наконец-то начинает возвращаться!! это такое классное ощущение..... хочется говорить и говорить","caption": "","photo": "","type": "text","date": 1740142076,"avatar": "avatars/721599287.jpg"},{"msg_id": 223,"sender": "Ann","username": "Anna_Peyl","text": "Оксана, привет!\nЯ хочу сказать просто огромное спасибо за поддержку и такое подробное объяснение по клубам 💖\nЭто было очень полезно, особенно видео, и отдельное спасибо за сообщение со списком! \nЭто было правда очень полезно, я подумала, что попробую снова начать с каких-нибудь легких клубов для меня как passive in active out и word of the day, потому что к ним можно подготовиться, чтобы моя гиперконтролирующая психика привыкла 😄\nИ схожу в эти выходные на Sunday branch, уверена, что все будет хорошо, главное почаще пинать себя и свою неуверенность))\nЕще раз огромное спасибо за поддержку и помощь 💖","caption": "","photo": "","type": "text","date": 1740036132,"avatar": "avatars/172045211.jpg"},{"msg_id": 218,"sender": "","username": "","text": "","caption": "","photo": "images/review_218.jpg","type": "photo","date": 1739709332},{"msg_id": 219,"sender": "","username": "","text": "","caption": "","photo": "images/review_219.jpg","type": "photo","date": 1739709332},{"msg_id": 220,"sender": "","username": "","text": "","caption": "","photo": "images/review_220.jpg","type": "photo","date": 1739709332},{"msg_id": 215,"sender": "","username": "","text": "","caption": "","photo": "images/review_215.jpg","type": "photo","date": 1737740720},{"msg_id": 216,"sender": "","username": "","text": "","caption": "","photo": "images/review_216.jpg","type": "photo","date": 1737740720},{"msg_id": 212,"sender": "Дарья Иванова | Тренер по нейроинтеграции","username": "Dachkevich","text": "Hello everyone! I can't get to the intro, although I've been here with you for a month! 🙆🏼‍♀️🙈 Now I want to thank Anya @anyachovhan for today's English speaking club! Although I'm often unsure of my English, sometimes I forget words and get nervous - it was very comfortable and fun today! I'm glad that this lesson was in the morning and charged me up for the whole day! 🚀","caption": "","photo": "","type": "text","date": 1737544566,"avatar": "avatars/229813835.jpg"},{"msg_id": 213,"sender": "Эмма","username": "","text": "After our wonderful meeting I decided to start applying the knowledge I had gained right away. I realized that I had been doing things since 8am today and decided to stop and go for a walk.\n\nThank you girls ❤️","caption": "","photo": "","type": "text","date": 1737488372},{"msg_id": 211,"sender": "Соня @sophie.turgul","username": "sophie_turgul","text": "Thank you everybody and Alina @linkasss for today’s podcast hub 💖\n\nNot only it reminded me how great it is to attend speaking clubs, but also gave some amazing food for thought about happiness 🤌🏻\n\nPS sorry for my terrible zodiac sign guesses 🫣\nI never guess correctly but am always surprised how actual sign of a person actually makes sense 😂🙏🏻","caption": "","photo": "","type": "text","date": 1737128799,"avatar": "avatars/544660451.jpg"},{"msg_id": 210,"sender": "","username": "","text": "","caption": "😭😭😭😭","photo": "images/review_210.jpg","type": "photo","date": 1736849695},{"msg_id": 206,"sender": "","username": "","text": "","caption": "","photo": "images/review_206.jpg","type": "photo","date": 1736272023},{"msg_id": 207,"sender": "","username": "","text": "","caption": "","photo": "images/review_207.jpg","type": "photo","date": 1736272023},{"msg_id": 205,"sender": "","username": "","text": "","caption": "","photo": "images/review_205.jpg","type": "photo","date": 1735387593},{"msg_id": 204,"sender": "","username": "","text": "","caption": "","photo": "images/review_204.jpg","type": "photo","date": 1735387427},{"msg_id": 203,"sender": "","username": "","text": "","caption": "","photo": "images/review_203.jpg","type": "photo","date": 1735385752},{"msg_id": 202,"sender": "","username": "","text": "","caption": "","photo": "images/review_202.jpg","type": "photo","date": 1734717911},{"msg_id": 201,"sender": "","username": "","text": "","caption": "","photo": "images/review_201.jpg","type": "photo","date": 1734717904},{"msg_id": 200,"sender": "Regina Sutarmina","username": "reginalichi","text": "привет! я сегодня сходила на podcast hub (второй мой класс). хотела просто поделиться впечатлениями, так как это новый формат (если я правильно поняла). мне очень понравился и сам формат, и учитель очень классная. здорово, что вовлеченность постоянно поддерживалась, сменялись активности, была поддержка учителя + небольшая группа в этот раз. в общем очень поддерживаю продолжать такой формат 😊","caption": "","photo": "","type": "text","date": 1733735792,"avatar": "avatars/645232564.jpg"},{"msg_id": 199,"sender": "katrin","username": "yo_katrin","text": "Oksi, I loved the speed befriending so freaking much 😭\nI had my phone with a screen down and I was afraid to check the time because I didn’t want christmas popizdelki to end - thank you for questions and for your gorgeous presentations 💔","caption": "","photo": "","type": "text","date": 1733340220},{"msg_id": 198,"sender": "Maria","username": "","text": "Honestly, mentor Valery deserves an official license as a depression-fighting specialist — her smile and positivity could cure November blues in no time!","caption": "","photo": "","type": "text","date": 1732972411},{"msg_id": 196,"sender": "Елизавета","username": "","text": "Lera, thank you so much for this reflection session 🥰\nIt was so comfortable, I also like that you left room for us to actually think and pay attention to our feelings. And by the way you motivated me to return to journaling 😅","caption": "","photo": "","type": "text","date": 1732972273},{"msg_id": 193,"sender": "","username": "","text": "","caption": "old but gold","photo": "images/review_193.jpg","type": "photo","date": 1732517773},{"msg_id": 194,"sender": "","username": "","text": "","caption": "","photo": "images/review_194.jpg","type": "photo","date": 1732517773},{"msg_id": 195,"sender": "","username": "","text": "","caption": "","photo": "images/review_195.jpg","type": "photo","date": 1732517773},{"msg_id": 192,"sender": "Polina Dudareva","username": "pollydud","text": "For some reason comment button in zoom fails to work today😭 Thank you a lot for the club! I am always really inspired after spending an hour of English with you!! And podcast hub is my special favourite for sure!!","caption": "","photo": "","type": "text","date": 1732203340,"avatar": "avatars/527816013.jpg"},{"msg_id": 191,"sender": "Olga Zhebit","username": "Olga_Zhebit","text": "@Oksi_doksi, thanks for the atmosphere and for the great chat. I'm sooooo glad, I could finally made it. \nNow I see, why I soooo desparately wanted to attend the club, where your're the mentor 💗💗💗","caption": "","photo": "","type": "text","date": 1731526750,"avatar": "avatars/444257420.jpg"},{"msg_id": 190,"sender": "","username": "","text": "","capt // --- Avatar gradient palettes ---
const GRADIENTS = [
  ['#ff6b6b','#ffa259'],
  ['#a259ff','#59c4ff'],
  ['#ff6b9d','#c471ed'],
  ['#48c6ef','#6f86d6'],
  ['#f093fb','#f5576c'],
  ['#4facfe','#00f2fe'],
  ['#43e97b','#38f9d7'],
  ['#fa709a','#fee140'],
  ['#a18cd1','#fbc2eb'],
  ['#fccb90','#d57eeb'],
  ['#e0c3fc','#8ec5fc'],
  ['#f5af19','#f12711'],
];

function hashStr(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) h = ((h << 5) - h + str.charCodeAt(i)) | 0;
  return Math.abs(h);
}

function getGradient(name) {
  if (!name) return GRADIENTS[0];
  return GRADIENTS[hashStr(name) % GRADIENTS.length];
}

function formatDate(ts) {
  const d = new Date(ts * 1000);
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${months[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
}

function getInitial(name) {
  if (!name) return '';
  const parts = name.trim().split(/\s+/);
  return parts.length > 1
    ? (parts[0][0] + parts[parts.length - 1][0]).toUpperCase()
    : parts[0][0].toUpperCase();
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// --- Accent card classes ---
const ACCENT_CLASSES = ['card-gradient-warm', 'card-gradient-cool', 'card-gradient-sunset'];

function buildCard(review, index) {
  const card = document.createElement('div');
  const isPhoto = review.type === 'photo' && review.photo;
  card.className = 'card' + (isPhoto ? ' card-photo' : ' card-text');
  card.dataset.type = review.type;

  // Gradient accent for some text cards
  if (!isPhoto && (index % 5 === 2 || index % 8 === 0)) {
    card.classList.add(ACCENT_CLASSES[(index * 3) % ACCENT_CLASSES.length]);
  }

  let html = '';

  if (isPhoto) {
    html += `<img src="${escapeHtml(review.photo)}" alt="Review" loading="lazy">`;
    if (review.caption) {
      html += `<div class="card-caption">${escapeHtml(review.caption)}</div>`;
    }
  } else {
    const text = review.text || review.caption || '';
    const isLong = text.length > 300;
    html += `<div class="quote-accent"></div>`;
    html += `<div class="card-body${isLong ? ' long' : ''}">${escapeHtml(text)}</div>`;
    if (isLong) html += `<span class="read-more"><span>Read more &#8594;</span></span>`;
  }

  // Sender
  const senderName = review.sender && review.sender !== 'Deleted Account' && review.sender !== 'Unknown' ? review.sender : '';
  if (senderName || review.date) {
    const grad = getGradient(senderName || String(review.msg_id));
    const initial = senderName ? getInitial(senderName) : '&#10084;';
    html += `<div class="card-sender">`;
    if (review.avatar) {
      html += `<div class="avatar" style="background: none; padding: 0;"><img src="${escapeHtml(review.avatar)}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:50%;"></div>`;
    } else {
      html += `<div class="avatar" style="background: linear-gradient(135deg, ${grad[0]}, ${grad[1]})">${senderName ? escapeHtml(initial) : '&#10084;'}</div>`;
    }
    html += `<div class="sender-info">`;
    if (senderName) html += `<div class="name">${escapeHtml(senderName)}</div>`;
    if (review.date) html += `<div class="date">${formatDate(review.date)}</div>`;
    html += `</div></div>`;
  }

  card.innerHTML = html;

  // Expand
  const body = card.querySelector('.card-body.long');
  if (body) {
    const rm = card.querySelector('.read-more');
    const toggle = () => {
      const isExpanded = body.classList.toggle('expanded');
      if (rm) rm.innerHTML = isExpanded ? 'Show less' : 'Read more &#8594;';
    };
    if (rm) rm.addEventListener('click', toggle);
    body.addEventListener('click', toggle);
  }

  return card;
}

// Data is pre-sorted newest first
// Distribute into columns round-robin for correct visual order
const container = document.getElementById('masonry');
function getColCount() {
  const w = window.innerWidth;
  if (w <= 480) return 1;
  if (w <= 768) return 2;
  if (w <= 1100) return 3;
  return 4;
}
const colCount = getColCount();
const cols = [];
for (let c = 0; c < colCount; c++) {
  const col = document.createElement('div');
  col.className = 'masonry-col';
  container.appendChild(col);
  cols.push(col);
}
REVIEWS.forEach((review, i) => {
  const card = buildCard(review, i);
  cols[i % colCount].appendChild(card);
});



// --- Scroll reveal with stagger ---
const observer = new IntersectionObserver((entries) => {
  const visible = entries.filter(e => e.isIntersecting);
  visible.forEach((entry, i) => {
    setTimeout(() => {
      entry.target.classList.add('revealed');
      entry.target.style.transitionDelay = '0s';
    }, i * 60);
    observer.unobserve(entry.target);
  });
}, { threshold: 0.05, rootMargin: '40px' });

document.querySelectorAll('.card').forEach(card => observer.observe(card));


</script>
