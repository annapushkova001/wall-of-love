<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>wall of love — es club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.cdnfonts.com/css/normalidad-extended" rel="stylesheet">
<style>
  :root {
    --bg-1: #0a0a0f;
    --bg-2: #12121a;
    --bg-card: rgba(255, 255, 255, 0.06);
    --bg-card-hover: rgba(255, 255, 255, 0.1);
    --glass-border: rgba(255, 255, 255, 0.08);
    --text: #f0eef5;
    --text-muted: rgba(240, 238, 245, 0.5);
    --accent-1: #ff6b6b;
    --accent-2: #ffa259;
    --accent-3: #a259ff;
    --accent-4: #59c4ff;
    --radius: 20px;
    --col-gap: 18px;
    --row-gap: 18px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg-1);
    color: var(--text);
    font-family: 'Outfit', sans-serif;
    font-size: 15px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* --- AMBIENT BACKGROUND --- */
  .bg-glow {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }

  .bg-glow .orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(120px);
    opacity: 0.2;
    animation: orbFloat 20s ease-in-out infinite;
  }

  .bg-glow .orb-1 {
    width: 700px; height: 700px;
    background: var(--accent-1);
    top: -15%; left: -10%;
    animation: orbFloat1 25s ease-in-out infinite;
  }

  .bg-glow .orb-2 {
    width: 550px; height: 550px;
    background: var(--accent-3);
    top: 20%; right: -12%;
    animation: orbFloat2 30s ease-in-out infinite;
  }

  .bg-glow .orb-3 {
    width: 450px; height: 450px;
    background: var(--accent-4);
    bottom: 10%; left: 25%;
    animation: orbFloat3 22s ease-in-out infinite;
  }

  .bg-glow .orb-4 {
    width: 500px; height: 500px;
    background: var(--accent-2);
    top: 50%; left: -5%;
    animation: orbFloat4 28s ease-in-out infinite;
  }

  @keyframes orbFloat1 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    25% { transform: translate(60px, 40px) scale(1.15); }
    50% { transform: translate(-30px, 80px) scale(0.95); }
    75% { transform: translate(40px, -20px) scale(1.08); }
  }

  @keyframes orbFloat2 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    25% { transform: translate(-50px, 30px) scale(1.1); }
    50% { transform: translate(40px, -40px) scale(0.9); }
    75% { transform: translate(-20px, -60px) scale(1.05); }
  }

  @keyframes orbFloat3 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    30% { transform: translate(70px, -50px) scale(1.12); }
    60% { transform: translate(-40px, 30px) scale(0.92); }
  }

  @keyframes orbFloat4 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    35% { transform: translate(50px, -70px) scale(1.1); }
    65% { transform: translate(-60px, 40px) scale(0.95); }
  }

  /* --- NOISE OVERLAY --- */
  .noise {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    z-index: 1;
    opacity: 0.03;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
  }

  .content { position: relative; z-index: 2; }

  /* --- HEADER --- */
  .hero {
    text-align: center;
    padding: 72px 24px 24px;
    max-width: 800px;
    margin: 0 auto;
    position: relative;
  }

  .hero h1 {
    font-family: 'Normalidad Extended', 'Bebas Neue', sans-serif;
    font-size: clamp(42px, 8vw, 80px);
    font-weight: 700;
    line-height: 0.95;
    letter-spacing: -0.05em;
    margin-bottom: 12px;
    white-space: nowrap;
    position: relative;
    display: inline-block;
    animation: fadeUp 0.8s ease 0.1s both;
    background: linear-gradient(
      90deg,
      #fff 0%,
      #fff 40%,
      #D9C6FF 48%,
      #8EC6B2 53%,
      #FF7E56 58%,
      #fff 68%,
      #fff 100%
    );
    background-size: 200% 100%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: fadeUp 0.8s ease 0.1s both, shimmer 4s ease-in-out infinite 1s;
  }

  @keyframes shimmer {
    0% { background-position: 100% 0; }
    100% { background-position: -100% 0; }
  }

  .hero-heart {
    font-size: 28px;
    display: inline-block;
    animation: fadeUp 0.8s ease 0.2s both, heartPulse 1.5s ease-in-out infinite;
    margin-bottom: 8px;
    filter: drop-shadow(0 0 12px rgba(255, 107, 107, 0.5));
  }

  @keyframes heartPulse {
    0%, 100% { transform: scale(1); }
    15% { transform: scale(1.25); }
    30% { transform: scale(1); }
    45% { transform: scale(1.15); }
    60% { transform: scale(1); }
  }





  .hero-stats {
    margin-top: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 32px;
    animation: fadeUp 0.8s ease 0.35s both;
  }

  .stat { text-align: center; }

  .stat-number {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 34px;
    letter-spacing: 0.04em;
    font-weight: 400;
    color: #fff;
  }

  .stat-label {
    font-size: 11px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-top: 2px;
  }

  .stat-divider {
    width: 1px;
    height: 28px;
    background: var(--glass-border);
  }

  /* --- AVATAR CLOUD --- */
  .avatar-cloud {
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 28px;
    animation: fadeUp 0.8s ease 0.25s both;
  }

  .avatar-stack {
    display: flex;
    margin-right: 14px;
  }

  .avatar-stack .av {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: none;
    margin-left: -6px;
    object-fit: cover;
    background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
    transition: transform 0.3s ease;
    opacity: 0;
    transform: translateX(20px);
    animation: avSlideIn 0.5s ease forwards;
  }

  .avatar-stack .av:nth-child(1) { animation-delay: 0.5s; }
  .avatar-stack .av:nth-child(2) { animation-delay: 0.6s; }
  .avatar-stack .av:nth-child(3) { animation-delay: 0.7s; }
  .avatar-stack .av:nth-child(4) { animation-delay: 0.8s; }
  .avatar-stack .av:nth-child(5) { animation-delay: 0.9s; }
  .avatar-stack .av:nth-child(6) { animation-delay: 1.0s; }
  .avatar-stack .av:nth-child(7) { animation-delay: 1.1s; }
  .avatar-stack .av:nth-child(8) { animation-delay: 1.2s; }

  @keyframes avSlideIn {
    to { opacity: 1; transform: translateX(0); }
  }

  .avatar-stack .av:hover {
    transform: scale(1.15);
    z-index: 2;
  }

  .avatar-stack .av:first-child { margin-left: 0; }

  .avatar-cloud .cloud-text {
    font-size: 14px;
    color: var(--text-muted);
    font-weight: 400;
  }

  .avatar-cloud .cloud-text strong {
    color: #fff;
    font-weight: 600;
  }



  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-12px); }
    to { opacity: 1; transform: translateY(0); }
  }



  /* --- MASONRY --- */
  .masonry {
    max-width: 1360px;
    margin: 0 auto;
    padding: 48px 24px 100px;
    display: flex;
    gap: var(--col-gap);
    align-items: flex-start;
  }

  .masonry-col {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: var(--row-gap);
  }

  @media (max-width: 1100px) {
    .masonry-col:nth-child(4) { display: none; }
  }
  @media (max-width: 768px) {
    .masonry-col:nth-child(3) { display: none; }
    .masonry-col:nth-child(4) { display: none; }
  }
  @media (max-width: 480px) {
    .masonry-col:nth-child(2) { display: none; }
    .masonry-col:nth-child(3) { display: none; }
    .masonry-col:nth-child(4) { display: none; }
    .masonry { max-width: 420px; }
  }

  /* --- CARD BASE --- */
  .card {
    background: var(--bg-card);
    backdrop-filter: blur(16px);
    border-radius: var(--radius);
    border: 1px solid var(--glass-border);
    overflow: hidden;
    transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
    opacity: 0;
    transform: translateY(30px) scale(0.97);
  }

  .card.revealed {
    opacity: 1;
    transform: translateY(0) scale(1);
  }

  .card:hover {
    background: var(--bg-card-hover);
    border-color: rgba(255, 255, 255, 0.14);
    transform: translateY(-4px) scale(1.01);
    box-shadow: 0 8px 40px rgba(0, 0, 0, 0.3), 0 0 60px rgba(255, 107, 107, 0.05);
  }

  /* --- PHOTO CARD --- */
  .card-photo img {
    width: 100%;
    display: block;
  }

  .card-photo .card-caption {
    padding: 16px 20px;
    font-size: 14px;
    line-height: 1.65;
    color: var(--text);
    font-weight: 300;
  }

  .card-photo .card-sender {
    margin: 0 20px 16px;
    padding-top: 12px;
  }

  /* --- TEXT CARD --- */
  .card-text {
    padding: 28px 24px 24px;
  }

  .card-text .quote-accent {
    width: 28px;
    height: 3px;
    border-radius: 2px;
    background: linear-gradient(90deg, var(--accent-1), var(--accent-2));
    margin-bottom: 16px;
  }

  .card-text .card-body {
    font-size: 14.5px;
    line-height: 1.75;
    color: rgba(240, 238, 245, 0.85);
    font-weight: 300;
    white-space: pre-line;
  }

  .card-text .card-body.long {
    max-height: 200px;
    overflow: hidden;
    position: relative;
  }

  .card-text .card-body.long::after {
    display: none;
  }

  .card-text .card-body.expanded {
    max-height: none;
  }

  .card-text .read-more {
    display: none;
    margin-top: 12px;
    font-size: 13px;
    color: var(--accent-1);
    cursor: pointer;
    font-weight: 500;
    transition: all 0.2s;
    padding: 4px 0;
    border: none;
    background: none;
    font-family: inherit;
  }

  .card-text .read-more:hover { opacity: 0.7; }
  .card-text .card-body.long ~ .read-more { display: inline-block; }
  .card-text .card-body.expanded ~ .read-more span { display: none; }

  /* --- SENDER --- */
  .card-sender {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 18px;
    padding-top: 14px;
    border-top: 1px solid var(--glass-border);
  }

  .avatar {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;
    font-size: 13px;
    color: white;
    flex-shrink: 0;
    position: relative;
    overflow: hidden;
  }

  .card-sender .sender-info .name {
    font-weight: 500;
    font-size: 13px;
    color: var(--text);
  }

  .card-sender .sender-info .date {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 1px;
  }

  /* --- GRADIENT ACCENT CARDS --- */
  .card-gradient-warm {
    background: linear-gradient(145deg, rgba(255, 107, 107, 0.15), rgba(255, 162, 89, 0.08));
    border-color: rgba(255, 107, 107, 0.15);
  }

  .card-gradient-warm:hover {
    background: linear-gradient(145deg, rgba(255, 107, 107, 0.22), rgba(255, 162, 89, 0.12));
    border-color: rgba(255, 107, 107, 0.25);
    box-shadow: 0 8px 40px rgba(255, 107, 107, 0.1);
  }

  .card-gradient-warm .card-body.long::after {
    display: none; /* background: linear-gradient(transparent, rgba(30, 15, 15, 0.95));
  }

  .card-gradient-cool {
    background: linear-gradient(145deg, rgba(162, 89, 255, 0.12), rgba(89, 196, 255, 0.08));
    border-color: rgba(162, 89, 255, 0.12);
  }

  .card-gradient-cool:hover {
    background: linear-gradient(145deg, rgba(162, 89, 255, 0.2), rgba(89, 196, 255, 0.12));
    border-color: rgba(162, 89, 255, 0.2);
    box-shadow: 0 8px 40px rgba(162, 89, 255, 0.1);
  }

  .card-gradient-cool .card-body.long::after {
    display: none; /* background: linear-gradient(transparent, rgba(18, 15, 30, 0.95));
  }

  .card-gradient-cool .quote-accent {
    background: linear-gradient(90deg, var(--accent-3), var(--accent-4));
  }

  .card-gradient-sunset {
    background: linear-gradient(145deg, rgba(255, 162, 89, 0.15), rgba(255, 107, 107, 0.1), rgba(162, 89, 255, 0.08));
    border-color: rgba(255, 162, 89, 0.15);
  }

  .card-gradient-sunset:hover {
    background: linear-gradient(145deg, rgba(255, 162, 89, 0.22), rgba(255, 107, 107, 0.15), rgba(162, 89, 255, 0.12));
    border-color: rgba(255, 162, 89, 0.25);
    box-shadow: 0 8px 40px rgba(255, 162, 89, 0.1);
  }

  .card-gradient-sunset .quote-accent {
    background: linear-gradient(90deg, var(--accent-2), var(--accent-1), var(--accent-3));
  }

  .card-gradient-sunset .card-body.long::after {
    display: none; /* background: linear-gradient(transparent, rgba(25, 18, 12, 0.95));
  }

  /* --- FOOTER --- */
  .footer {
    text-align: center;
    padding: 40px 24px 60px;
    color: var(--text-muted);
    font-size: 14px;
    font-weight: 300;
    position: relative;
    z-index: 2;
  }

  .footer a {
    color: var(--accent-1);
    text-decoration: none;
    font-weight: 500;
    transition: opacity 0.2s;
  }

  .footer a:hover { opacity: 0.7; }

  /* --- MOBILE HERO --- */
  @media (max-width: 768px) {
    .hero {
      padding: 56px 16px 12px;
    }

    .hero h1 {
      font-size: 18vw !important;
      margin-bottom: 14px;
    }

    .hero-stats {
      gap: 10px;
      margin-top: 14px;
    }

    .stat-number {
      font-size: 20px !important;
      line-height: 1.1;
    }

    .stat-label {
      font-size: 8px !important;
      letter-spacing: 0.04em;
      margin-top: 1px;
    }

    .stat-divider {
      height: 16px;
    }

    .masonry {
      padding-top: 28px !important;
    }
  }
</style>
</head>
<body>

<div class="bg-glow">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
  <div class="orb orb-4"></div>
</div>
<div class="noise"></div>

<div class="content">

<header class="hero">
  <h1>wall of love</h1>
  <div class="hero-heart">❤️</div>
</header>



<main class="masonry" id="masonry"></main>

<footer class="footer">
  made with love by <a href="#">es club</a>
</footer>

</div>

3b\u0430 \u043f\u0440\u043e\u0431\u043b\u0435\u043c\u0430, \u0447\u0442\u043e \u0443 \u0441\u0435\u0431\u044f \u0432 \u0433\u043e\u043b\u043e\u0432\u0435 \u044f \u043c\u043e\u0433\u0443 \u043f\u0440\u043e\u0434\u0443\u043c\u0430\u0442\u044c \u043f\u0440\u0435\u0434\u043b\u043e\u0436\u0435\u043d\u0438\u044f/\u0440\u0430\u0441\u0441\u043a\u0430\u0437, \u0441\u0434\u0435\u043b\u0430\u0442\u044c \u044d\u0442\u043e \u0441 \u0440\u0430\u0437\u043d\u044b\u043c\u0438 \u0432\u0440\u0435\u043c\u0435\u043d\u0430\u043c\u0438 \u0438 \u0441\u043b\u043e\u0432\u0430\u043c\u0438, \u043d\u043e \u043a\u0430\u043a \u0442\u043e\u043b\u044c\u043a\u043e \u043e\u0442\u043a\u0440\u044b\u0432\u0430\u043b\u0441\u044f \u0440\u043e\u0442, \u0442\u043e \u0442\u0430\u043a\u043e\u0435 \u043e\u0449\u0443\u0449\u0435\u043d\u0438\u0435, \u0447\u0442\u043e \u0430\u043d\u0433\u043b\u0438\u0439\u0441\u043a\u0438\u0439 \u044f \u043d\u0438\u043a\u043e\u0433\u0434\u0430 \u0438 \u043d\u0435 \u0443\u0447\u0438\u043b\u0430\u2026. \u0441\u0435\u0439\u0447\u0430\u0441 \u0436\u0435 \u044f \u0432\u044b\u0440\u0430\u0436\u0430\u044e \u0441\u0432\u043e\u0435 \u043c\u043d\u0435\u043d\u0438\u0435 \u0438 \u043c\u044b\u0441\u043b\u0438. \u041a\u043e\u043d\u0435\u0447\u043d\u043e, \u043d\u0435 \u0432 \u0442\u0430\u043a\u043e\u043c \u0444\u043e\u0440\u043c\u0430\u0442\u0435, \u043a\u0430\u043a \u0445\u043e\u0442\u0435\u043b\u043e\u0441\u044c \u0431\u044b, \u043d\u043e \u0443\u0432\u0435\u0440\u0435\u043d\u0430, \u0447\u0442\u043e \u043f\u0440\u0438\u0434\u0443 \u043a \u044d\u0442\u043e\u043c\u0443, \u043d\u0443\u0436\u043d\u043e \u043f\u0440\u043e\u0441\u0442\u043e \u0447\u0443\u0442\u044c \u0431\u043e\u043b\u044c\u0448\u0435 \u0432\u0440\u0435\u043c\u0435\u043d\u0438) \n\n\u041e\u0442 \u0434\u0435\u0432\u0443\u0448\u0435\u043a \u0432 \u043a\u043e\u043c\u044c\u044e\u043d\u0438\u0442\u0438 \u044f \u0442\u043e\u0436\u0435 \u0432 \u0432\u043e\u0441\u0445\u0438\u0449\u0435\u043d\u0438\u0438: \u0432\u0441\u0435 \u0442\u0430\u rovoking conversation! I loved it, so many insights! \nI've even written notes on my Notion \ud83d\ude0d", "photo": "images/review_237.jpg", "type": "photo", "date": 1746727170}, {"msg_id": 236, "sender": "Veronica Samoylova", "username": "veronicasam", "text": "I\u2019ve already said it during our club, but I\u2019ll say it again\n\nIf there\u2019s a premium version of a speaking club in ES than it\u2019s definitely the DEBATES CLUB \n\nHuge shoutout to Alina, the mentor, for such thought-provoking statements! \n\nI genuinely appreciate the amount of brainwork we put in, critical thinking, soft skills, reasoning, I mean, there\u2019s so much more to it. \n\nSo dear ES people, do come to Debates it\u2019s so fucking amazing \n(I\u2019m pretty sure our permanent band members will second that ahahah)", "caption": "", "photo": "", "type": "text", "date": 1746039879, "avatar": "avatars/292228095.jpg"}, {"msg_id": 234, "sender": "valery larionova", "username": "valeryverse", "text": "", "caption": "", "photo": "images/review_234.jpg", "type": "photo", "date": 1744388690, "avatar": "avatars/1195267675.jpg"}, {"msg_id": 233, "sender": "", "username": "", "text": "", "caption": "", "photo": "images/review_233.jpg", "type": "photo", "date": 1744387886}, {"msg_id": 235, "sender": "Irina Teplyuk", "username": "irintea", "text": "Valeria, hello again! I just want to say that I really enjoyed our speaking club today. I haven\u2019t discussed anything in English for quite a long time, for a month I think. And l was glad to remember that I can actually say  something in English. Thank you so much for hosting this speaking session \u2728 You know, talking about job is even better than the job itself haha \n\nBtw, I really like your jacket, you look stunning \ud83e\udd0d", "caption": "", "photo": "", "type": "text", "date": 1744306732, "avatar": "avatars/722256379.jpg"}, {"msg_id": 231, "sender": "Maria", "username": "", "text": "\u041f\u0440\u0438\u0432\u0435\u0442, \u0410\u043d\u044f! \u041a\u0430\u0436\u0434\u044b\u0439 \u0434\u0435\u043d\u044c \u0432\u0441\u043f\u043e\u043c\u0438\u043d\u0430\u043b\u0430 \u043f\u0440\u043e \u0442\u0432\u043e\u0435 \u0441\u043e\u043e\u0431\u0449\u0435\u043d\u0438\u0435 \u0438 \u0445\u043e\u0442\u0435\u043b\u043e\u0441\u044c \u0432\u044b\u0434\u0435\u043b\u0438\u0442\u044c \u0432\u0440\u0435\u043c\u044f, \u0447\u0442\u043e\u0431\u044b \u0431\u043e\u043b\u0435\u0435 \u0440\u0430\u0437\u0432\u0435\u0440\u043d\u0443\u0442\u043e \u043e\u0442\u0432\u0435\u0442\u0438\u0442\u044c)\n\n\u041c\u043d\u0435 \u043a\u0430\u043a \u0432\u0441\u0435\u0433\u0434\u0430 \u0432\u0441\u0451 \u043e\u0447\u0435\u043d\u044c \u043d\u0440\u0430\u0432\u0438\u0442\u0441\u044f! \u041c\u0435\u043d\u0442\u043e\u0440\u044b \u0442\u043e\u043f, \u0442\u0435\u043c\u044b \u043e\u0433\u043e\u043d\u044c, \u043b\u044e\u0431\u043b\u044e\u043e\u0431\u043e\u0436\u0430\u044e \u0438 \u0432\u0441\u0435\u043c \u0432\u043e\u043a\u0440\u0443\u0433 \u0441\u043e\u0432\u0435\u0442\u0443\u044e!\n\u0412\u043e\u043e\u0431\u0449\u0435, \u043a\u043e\u043d\u0435\u0447\u043d\u043e, \u0441\u043f\u0430\u0441\u0438\u0431\u043e \u0432\u0441\u0435\u043c \u043c\u0435\u043d\u0442\u043e\u0440\u0430\u043c, \u0432\u0441\u0435\u0433\u0434\u0430 \u0442\u0430\u043a\u0438\u0435 \u0443\u043b\u044b\u0431\u0447\u0438\u0432\u044b\u0435 \u0438 \u0437\u0430\u0440\u044f\u0436\u0435\u043d\u043d\u044b\u0435, \u0447\u0442\u043e \u043f\u0440\u043e\u0441\u0442\u043e \u043d\u0435 \u043e\u0441\u0442\u0430\u0435\u0442\u0441\u044f \u0448\u0430\u043d\u0441\u043e\u0432 \u0431\u0435\u0437 \u0443\u043b\u044b\u0431\u043a\u0438 \u043e\u0442 \u0432\u0430\u0441 \u0443\u0439\u0442\u0438)\n\n\u0412 \u043f\u0440\u043e\u0448\u043b\u043e\u043c \u043c\u0435\u0441\u044f\u0446\u0435 \u043d\u0435 \u043e\u0447\u0435\u043d\u044c \u043c\u043d\u043e\u0433\u043e \u0443\u0447\u0430\u0441\u0442\u0432\u043e\u0432\u0430\u043b\u0430 \u0432 \u0437\u0432\u043e\u043d\u043a\u0430\u0445, \u0442\u0430\u043a \u043a\u0430\u043a \u0431\u044b\u043b\u043e \u043c\u043d\u043e\u0433\u043e \u0440\u0430\u0431\u043e\u0442\u044b, \u0440\u0430\u0431\u043e\u0442\u0430 \u0441\u0438\u0434\u044f\u0447\u0430\u044f \u0438 \u0432\u043e\u0442 \u043f\u043e\u0441\u043b\u0435\u0434\u043d\u0435\u0435, \u0447\u0442\u043e \u0445\u043e\u0442\u0435\u043b\u043e\u0441\u044c \u044d\u0442\u043e \u0435\u0449\u0435 \u0434\u043e\u043b\u044c\u0448\u0435 \u0441\u0438\u0434\u0435\u0442\u044c \u0437\u0430 \u043d\u043e\u0443\u0442\u043e\u043c)) \u0410 \u0441\u0435\u0439\u0447\u0430\u0441, \u043a\u0430\u0436\u0435\u0442\u0441\u044f, \u043d\u0430\u0448\u043b\u0430 \u043e\u043f\u0442\u0438\u043c\u0430\u043b\u044c\u043d\u044b\u0439 \u0433\u0440\u0430\u0444\u0438\u043a, \u043f\u043e\u0434\u043a\u043b\u044e\u0447\u0430\u044e\u0441\u044c \u0438 \u043a\u043e\u0433\u0434\u0430 \u0432\u044b\u0445\u043e\u0436\u0443 \u043d\u0430 \u043f\u0440\u043e\u0433\u0443\u043b\u043a\u0443, \u0438 \u043a\u043e\u0433\u0434\u0430 \u0433\u043e\u0442\u043e\u0432\u043b\u044e, \u0438\u043b\u0438 \u043f\u044c\u044e \u0433\u0434\u0435-\u0442\u043e \u043a\u043e\u0444\u0435. \u0412 \u043e\u0431\u0449\u0435\u043c \u0432 \u044d\u0442\u043e\u043c \u043c\u0435\u0441\u044f\u0446\u0435 \u0441\u0442\u0430\u0440\u0430\u044e\u0441\u044c \u0431\u044b\u0442\u044c \u0430\u043a\u0442\u0438\u0432\u043d\u0435\u0435\n\u041a\u043e\u0433\u0434\u0430 \u043c\u043e\u0442\u0438\u0432\u0430\u0446\u0438\u044f \u0441\u043f\u0430\u0434\u0430\u0435\u0442, \u043f\u043e\u0434\u043a\u043b\u044e\u0447\u0430\u044e\u0441\u044c \u043d\u0430 \u043b\u044e\u0431\u043e\u0439 \u043a\u043b\u0443\u0431, \u0438 \u0432\u043e\u0442 \u043c\u0435\u043d\u0442\u043e\u0440\u044b \u0438 \u0443\u0447\u0430\u0441\u0442\u043d\u0438\u043a\u0438 \u043c\u0435\u043d\u044f \u043a\u0430\u043a-\u0442\u043e \u043a\u0430\u0436\u0434\u044b\u0439 \u0440\u0430\u0437 \u043e\u0447\u0435\u043d\u044c \u043a\u0430\u0447\u0435\u0441\u0442\u0432\u0435\u043d\u043d\u043e \u0437\u0430\u0440\u044f\u0436\u0430\u044e\u0442)\n\n\u0411\u044b\ view questions in such a safe and supportive space \u2764\ufe0f", "caption": "", "photo": "", "type": "text", "date": 1729762291, "avatar": "avatars/224236535.jpg"}, {"msg_id": 184, "sender": "Maria", "username": "", "text": "I looooove the mental health club so much! I learn more and more about myself. Today we are called \"the sin club\"\ud83d\ude01", "caption": "", "photo": "", "type": "text", "date": 1729523811}, {"msg_id": 183, "sender": "Polina Vlasova Yoga & English", "username": "", "text": "", "caption": "Big morning hello from me and Sveta @sv_kazak \nWe met offline in Da Nang, Vietnam \ud83c\uddfb\ud83c\uddf3 for coffee and 2 hours long conversations \u2763\ufe0f", "photo": "images/review_183.jpg", "type": "photo", "date": 1729229697}, {"msg_id": 181, "sender": "Olga Zhebit", "username": "Olga_Zhebit", "text": "", "caption": "@pushkovaanna, Anna, have no idea who has created those materials but they're absolutely fucking awesome\ud83d\udc96\ud83d\udc96\ud83d\udc96", "photo": "images/review_181.jpg", "type": "photo", "date": 1729145875, "avatar": "avatars/444257420.jpg"}, {"msg_id": 182, "sender": "\u0412\u0438", "username": "", "text": "\u041f\u0440\u0438\u0432\u0435\u0442!) \n\u041f\u043e\u0431\u044b\u0432\u0430\u043b\u0430 \u043d\u0430 \u0434\u0432\u0443\u0445 \u043a\u043b\u0443\u0431\u0430\u0445, \u0432\u0441\u0435 \u043e\u0447\u0435\u043d\u044c \u043f\u043e\u043d\u0440\u0430\u0432\u0438\u043b\u043e\u0441\u044c! \n\u0412 \u0443\u0440\u043e\u043a\u0438 \u043f\u043e\u043a\u0430 \u043d\u0435 \u0437\u0430\u0445\u043e\u0434\u0438\u043b\u0430 \ud83e\udd13\ud83e\udd13\ud83e\udd13\n\u041d\u043e \u043f\u043b\u0430\u043d\u0438\u0440\u0443\u044e! \n\u0437\u0430\u043f\u0438\u0441\u0430\u043b\u0430\u0441\u044c \u043d\u0430 \u0441\u043b\u0435\u0434\u0443\u044e\u0449\u0438\u0439 \u0440\u0430\u0437\u0433\u043e\u0432\u043e\u0440\u043d\u044b\u0439 \u0442\u043e\u0436\u0435 ! \n\u041f\u0440\u0435\u043a\u0440\u0430\u0441\u043d\u0430\u044f \u043f\u043e\u0434\u0434\u0435\u04 // --- Avatar gradient palettes ---
const GRADIENTS = [
  ['#ff6b6b','#ffa259'],
  ['#a259ff','#59c4ff'],
  ['#ff6b9d','#c471ed'],
  ['#48c6ef','#6f86d6'],
  ['#f093fb','#f5576c'],
  ['#4facfe','#00f2fe'],
  ['#43e97b','#38f9d7'],
  ['#fa709a','#fee140'],
  ['#a18cd1','#fbc2eb'],
  ['#fccb90','#d57eeb'],
  ['#e0c3fc','#8ec5fc'],
  ['#f5af19','#f12711'],
];

function hashStr(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) h = ((h << 5) - h + str.charCodeAt(i)) | 0;
  return Math.abs(h);
}

function getGradient(name) {
  if (!name) return GRADIENTS[0];
  return GRADIENTS[hashStr(name) % GRADIENTS.length];
}

function formatDate(ts) {
  const d = new Date(ts * 1000);
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${months[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
}

function getInitial(name) {
  if (!name) return '';
  const parts = name.trim().split(/\s+/);
  return parts.length > 1
    ? (parts[0][0] + parts[parts.length - 1][0]).toUpperCase()
    : parts[0][0].toUpperCase();
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// --- Accent card classes ---
const ACCENT_CLASSES = ['card-gradient-warm', 'card-gradient-cool', 'card-gradient-sunset'];

function buildCard(review, index) {
  const card = document.createElement('div');
  const isPhoto = review.type === 'photo' && review.photo;
  card.className = 'card' + (isPhoto ? ' card-photo' : ' card-text');
  card.dataset.type = review.type;

  // Gradient accent for some text cards
  if (!isPhoto && (index % 5 === 2 || index % 8 === 0)) {
    card.classList.add(ACCENT_CLASSES[(index * 3) % ACCENT_CLASSES.length]);
  }

  let html = '';

  if (isPhoto) {
    html += `<img src="${escapeHtml(review.photo)}" alt="Review" loading="lazy">`;
    if (review.caption) {
      html += `<div class="card-caption">${escapeHtml(review.caption)}</div>`;
    }
  } else {
    const text = review.text || review.caption || '';
    const isLong = text.length > 300;
    html += `<div class="quote-accent"></div>`;
    html += `<div class="card-body${isLong ? ' long' : ''}">${escapeHtml(text)}</div>`;
    if (isLong) html += `<span class="read-more"><span>Read more &#8594;</span></span>`;
  }

  // Sender
  const senderName = review.sender && review.sender !== 'Deleted Account' ? review.sender : '';
  if (senderName || review.date) {
    const grad = getGradient(senderName || String(review.msg_id));
    const initial = senderName ? getInitial(senderName) : '&#10084;';
    html += `<div class="card-sender">`;
    if (review.avatar) {
      html += `<div class="avatar" style="background: none; padding: 0;"><img src="${escapeHtml(review.avatar)}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:50%;"></div>`;
    } else {
      html += `<div class="avatar" style="background: linear-gradient(135deg, ${grad[0]}, ${grad[1]})">${senderName ? escapeHtml(initial) : '&#10084;'}</div>`;
    }
    html += `<div class="sender-info">`;
    if (senderName) html += `<div class="name">${escapeHtml(senderName)}</div>`;
    if (review.date) html += `<div class="date">${formatDate(review.date)}</div>`;
    html += `</div></div>`;
  }

  card.innerHTML = html;

  // Expand
  const body = card.querySelector('.card-body.long');
  if (body) {
    const rm = card.querySelector('.read-more');
    const toggle = () => {
      const isExpanded = body.classList.toggle('expanded');
      if (rm) rm.innerHTML = isExpanded ? 'Show less' : 'Read more &#8594;';
    };
    if (rm) rm.addEventListener('click', toggle);
    body.addEventListener('click', toggle);
  }

  return card;
}

// Data is pre-sorted newest first
// Distribute into columns round-robin for correct visual order
const container = document.getElementById('masonry');
function getColCount() {
  const w = window.innerWidth;
  if (w <= 480) return 1;
  if (w <= 768) return 2;
  if (w <= 1100) return 3;
  return 4;
}
const colCount = getColCount();
const cols = [];
for (let c = 0; c < colCount; c++) {
  const col = document.createElement('div');
  col.className = 'masonry-col';
  container.appendChild(col);
  cols.push(col);
}
REVIEWS.forEach((review, i) => {
  const card = buildCard(review, i);
  cols[i % colCount].appendChild(card);
});



// --- Scroll reveal with stagger ---
const observer = new IntersectionObserver((entries) => {
  const visible = entries.filter(e => e.isIntersecting);
  visible.forEach((entry, i) => {
    setTimeout(() => {
      entry.target.classList.add('revealed');
      entry.target.style.transitionDelay = '0s';
    }, i * 60);
    observer.unobserve(entry.target);
  });
}, { threshold: 0.05, rootMargin: '40px' });

document.querySelectorAll('.card').forEach(card => observer.observe(card));


</script>
